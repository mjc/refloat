name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: nixpkgs#llvmPackages_18.clang-tools, nixpkgs#pre-commit

      - name: Run clang-format
        id: clang-format
        run: pre-commit run --all-files --show-diff-on-failure --color always

  host-c-tests:
    name: Host C Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: nixpkgs#gcc, nixpkgs#gnumake, github:lukash/vesc_tool-flake/release_6_06

      - name: Run host C suites
        run: make -C tests check

  qml-smoke:
    name: QML Behavior
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: nixpkgs#gnumake, nixpkgs#qt6.qtdeclarative

      - name: Run QML smoke tests
        run: |
          qt_bin="$(dirname "$(command -v qmllint)")"
          qt_root="$(dirname "$qt_bin")"
          export PATH="$qt_root/libexec:$PATH"
          make -C tests check-qml-behavior

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs:
      - format
      - host-c-tests
      - qml-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build Package
        uses: ./.github/actions/build
        with:
          cache-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'
